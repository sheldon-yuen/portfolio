<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sheldon - Studio Archive</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Syncopate:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f1115;
            --panel-bg: #161920;
            --border-color: #2a2e39;
            --text-main: #e2e8f0;
            --text-muted: #8c95a6;
            --accent: #3b82f6;
            --font-mono: 'IBM Plex Mono', monospace;
            --font-heading: 'Syncopate', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-mono);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 2rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1.5rem;
            margin-bottom: 2rem;
        }

        .logo {
            font-family: var(--font-heading);
            font-size: 1.5rem;
            letter-spacing: 2px;
            color: var(--text-main);
        }

        .studio-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 0.5rem 1rem;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .studio-btn:hover {
            border-color: var(--accent);
            color: var(--text-main);
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .intro {
            color: var(--text-muted);
            font-size: 0.9rem;
            max-width: 600px;
            line-height: 1.6;
        }

        /* Modal Overlay */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 2rem;
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            letter-spacing: 1px;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.75rem;
        }

        .close-modal {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1rem;
        }

        .close-modal:hover {
            color: var(--text-main);
        }

        .modal input {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.75rem;
            font-family: var(--font-mono);
            font-size: 1rem;
            text-align: center;
            letter-spacing: 4px;
            width: 100%;
        }

        .modal input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .modal-actions {
            display: flex;
            gap: 1rem;
        }

        .modal-actions button {
            flex: 1;
            padding: 0.75rem;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            cursor: pointer;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-main);
        }

        .modal-actions button.primary {
            background: var(--text-main);
            color: var(--bg-color);
            border-color: var(--text-main);
            font-weight: 600;
        }

        .modal-actions button:hover {
            opacity: 0.9;
        }

        /* Studio Panel Dashboard */
        .studio-panel {
            display: none;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 2rem;
            margin-top: 1rem;
        }

        .studio-panel.active {
            display: block;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">SHELDON</div>
        <button class="studio-btn" id="studioTrigger">STUDIO</button>
    </header>

    <main>
        <p class="intro">This is where I keep the things I make and use: the things I archive — robotics, Lego, photography, and everything that catches a lens.</p>
        
        <!-- Studio Management Panel (Protected) -->
        <div class="studio-panel" id="studioPanel">
            <h3>STUDIO MANAGEMENT MODE</h3>
            <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 0.5rem;">Authenticated owner session active. You can manage and upload items here.</p>
            <button class="studio-btn" id="lockStudio" style="margin-top: 1rem;">LOCK & EXIT STUDIO</button>
        </div>
    </main>

    <!-- Auth Modal -->
    <div class="modal-overlay" id="authModal">
        <div class="modal" id="modalBox">
            <div class="modal-header">
                <span>ACCESS CONTROL // STUDIO AUTH</span>
                <button class="close-modal" id="closeModal">&times;</button>
            </div>
            <div style="font-size: 0.85rem; color: var(--text-muted);">ENTER OWNER PIN</div>
            <input type="password" id="pinInput" maxlength="4" placeholder="••••">
            <div class="modal-actions">
                <button id="cancelAuth">CANCEL</button>
                <button class="primary" id="submitAuth">UNLOCK STUDIO</button>
            </div>
        </div>
    </div>

    <script>
        const studioTrigger = document.getElementById('studioTrigger');
        const authModal = document.getElementById('authModal');
        const modalBox = document.getElementById('modalBox');
        const closeModal = document.getElementById('closeModal');
        const cancelAuth = document.getElementById('cancelAuth');
        const submitAuth = document.getElementById('submitAuth');
        const pinInput = document.getElementById('pinInput');
        const studioPanel = document.getElementById('studioPanel');
        const lockStudio = document.getElementById('lockStudio');

        let isUnlocked = false;

        function openAuthModal() {
            if (isUnlocked) {
                studioPanel.classList.toggle('active');
                return;
            }
            authModal.classList.add('active');
            pinInput.value = '';
            pinInput.focus();
        }

        function closeAuthModal() {
            authModal.classList.remove('active');
            pinInput.value = '';
        }

        function verifyPin() {
            const enteredPin = pinInput.value;
            // Default PIN is 1234
            if (enteredPin === '1234') {
                isUnlocked = true;
                closeAuthModal();
                studioPanel.classList.add('active');
                studioTrigger.textContent = 'STUDIO [UNLOCKED]';
            } else {
                alert('Invalid PIN');
                pinInput.value = '';
            }
        }

        function lockSession() {
            isUnlocked = false;
            studioPanel.classList.remove('active');
            studioTrigger.textContent = 'STUDIO';
        }

        studioTrigger.addEventListener('click', openAuthModal);
        closeModal.addEventListener('click', closeAuthModal);
        cancelAuth.addEventListener('click', closeAuthModal);
        submitAuth.addEventListener('click', verifyPin);
        
        pinInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') verifyPin();
        });

        // Automatically lock and close the studio panel when clicking outside the modal box
        authModal.addEventListener('click', (e) => {
            if (e.target === authModal) {
                closeAuthModal();
            }
        });

        lockStudio.addEventListener('click', lockSession);
    </script>
</body>
</html>
